[package]
name = "encsniff"
homepage = "https://github.com/excelano/encsniff"
version = "0.2.0"
edition = "2021"
# Measured, not inferred: the library builds on 1.56, 1.64 and 1.65. Nothing
# here raises the floor above the edition's own, unlike xaddr, where 1.64 fails
# on a `let ... else`. So this number is the edition, and it cannot drift
# upward the way a code-derived floor can — an edition bump would move it
# deliberately and loudly.
#
# `cargo test` needs 1.63, because the tempfile dev-dependency pulls rustix,
# which declares that floor. That is a constraint on developing this crate, not
# on using it: a consumer links the library and never builds its dev tree. The
# promise this line makes is to consumers, so it states what they need.
#
# There is an msrv job, and this said for a while that there could not be. The
# argument was that the shared rust-lib-ci runs tests, docs and packaging, none
# of which can run at 1.56 for the reason above, so a job would have to enforce
# 1.63 — a number this manifest does not claim. That is true of `cargo test`
# and false of `cargo check --lib`, which does not build dev-dependencies at
# all: measured 2026-08-27 from a clean target, `check --lib` compiles
# `tempfile` zero times and `test --no-run` compiles it once. So the job checks
# the library at 1.56 and nothing else, which is exactly the promise this line
# makes, and the floor is now verified on every push rather than on the day
# somebody last remembered to try it.
#
# The job builds without the lockfile, which is safe only because this crate has
# no runtime dependencies: there is nothing for a resolver to choose. A runtime
# dependency would change that, and the job says so where it does it.
rust-version = "1.56"
description = "Detect common non-UTF-8 text encodings from byte-perfect signatures (UTF-8 BOM, UTF-16 BOMs, UTF-7)"
license = "MIT"
authors = ["David M. Anderson"]
repository = "https://github.com/excelano/encsniff"
readme = "README.md"
keywords = ["encoding", "utf-7", "utf-8", "bom", "detection"]
categories = ["encoding", "text-processing"]

[dependencies]

[dev-dependencies]
tempfile = "3.27.0"
