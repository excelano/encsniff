name: ci

# The checks live in excelano/.github. This crate is linked by other code, so
# it calls the library policy: the binary checks plus the docs and packaging a
# published crate owes its consumers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-lib-ci.yml@main

  # The floor in Cargo.toml, checked rather than asserted.
  #
  # `Cargo.toml` argued there could be no such job, because the shared workflow
  # runs tests and `cargo test` needs 1.63 — `tempfile` pulls `rustix`, which
  # declares that floor — so a job would have to enforce a number this manifest
  # does not claim. True of `cargo test`, and not of `cargo check --lib`, which
  # does not build dev-dependencies at all. Measured 2026-08-27 from a clean
  # target on a sibling crate: `check --lib` compiles `tempfile` zero times,
  # `test --no-run` compiles it once.
  #
  # So this checks exactly the promise the manifest makes — that a consumer who
  # links the library can build it on 1.56 — and nothing else. Not in the shared
  # workflow, because the floor is this crate's own: it is edition 2021's, which
  # is why it cannot drift upward without an edition bump moving it loudly.
  #
  # No `--locked`, and the lockfile is moved aside. Two reasons, and the first
  # one is why the second is safe. This crate has no runtime dependencies at
  # all — `Cargo.lock`'s fourteen packages are `tempfile` and its tree, every
  # one of them a dev-dependency `check --lib` does not build — so there is
  # nothing for a resolver to choose differently and nothing `--locked` could
  # protect. And the committed lockfile is version 4, which needs cargo 1.78 to
  # parse; the declared minimum's cargo cannot read it, with or without the
  # flag, which is how the first version of this job failed.
  #
  # If this crate ever gains a runtime dependency, this stops being safe: put
  # `--locked` back and generate a lockfile the old cargo can read, or the job
  # will start failing for a resolver's choices rather than for this code.
  msrv:
    name: Builds on the declared minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the declared minimum
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          echo "Cargo.toml declares ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          echo "MSRV=${msrv}" >> "$GITHUB_ENV"
      - name: The library builds on it
        run: |
          mv Cargo.lock Cargo.lock.modern
          cargo +${{ env.MSRV }} check --lib
