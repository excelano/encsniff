name: ci

# The checks live in excelano/.github. This crate is linked by other code, so
# it calls the library policy: the binary checks plus the docs and packaging a
# published crate owes its consumers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-lib-ci.yml@main

  # The floor in Cargo.toml, checked rather than asserted.
  #
  # `Cargo.toml` argued there could be no such job, because the shared workflow
  # runs tests and `cargo test` needs 1.63 — `tempfile` pulls `rustix`, which
  # declares that floor — so a job would have to enforce a number this manifest
  # does not claim. True of `cargo test`, and not of `cargo check --lib`, which
  # does not build dev-dependencies at all. Measured 2026-08-27 from a clean
  # target on a sibling crate: `check --lib` compiles `tempfile` zero times,
  # `test --no-run` compiles it once.
  #
  # So this checks exactly the promise the manifest makes — that a consumer who
  # links the library can build it on 1.56 — and nothing else. Not in the shared
  # workflow, because the floor is this crate's own: it is edition 2021's, which
  # is why it cannot drift upward without an edition bump moving it loudly.
  #
  # The check runs against a manifest with the dev-dependencies stripped, and
  # that is the point rather than a workaround. A published crate hands its
  # consumers `[dependencies]` and never `[dev-dependencies]`: nobody linking
  # `encsniff` resolves `tempfile`, so nobody linking it meets `tempfile`'s
  # floor. The promise in `rust-version` is to those consumers, so the thing to
  # check is what they get — this crate, which depends on nothing at all.
  #
  # Two failures got here, both worth keeping. `--locked` failed because
  # `Cargo.lock` is version 4 and needs cargo 1.78 to parse. Removing the
  # lockfile then failed in the resolver — `cargo check --lib` does not *build*
  # dev-dependencies, which is measurable, but cargo still *resolves* them, and
  # 1.56 cannot satisfy `getrandom = ">=0.3.0, <0.5"` from `tempfile`'s tree.
  # Neither failure was about this crate's code, which is the definition of a
  # job testing the wrong thing.
  #
  # Everything is done on a copy under the runner's temp directory, so nothing
  # here can leave a stripped manifest or a stale lockfile in the checkout.
  msrv:
    name: Builds on the declared minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the declared minimum
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          echo "Cargo.toml declares ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          echo "MSRV=${msrv}" >> "$GITHUB_ENV"
      - name: The library builds on it
        run: |
          consumer="${RUNNER_TEMP}/as-a-consumer-sees-it"
          rm -rf "${consumer}"
          mkdir -p "${consumer}"
          cp -r Cargo.toml src "${consumer}/"

          # Everything from `[dev-dependencies]` to the next section header.
          python3 - "${consumer}/Cargo.toml" <<'STRIP'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          out = re.sub(r"(?ms)^\[dev-dependencies\].*?(?=^\[|\Z)", "", s)
          assert "[dev-dependencies]" not in out, "the section survived"
          p.write_text(out)
          print("dev-dependencies stripped")
          STRIP

          cd "${consumer}"
          cargo +${{ env.MSRV }} check --lib
