name: Publish to crates.io

# encsniff is a library crate — crates.io is its whole release. This publishes it
# on a version tag (and can be run by hand), keeping it available for the crates
# that depend on it (e.g. xled), which cannot publish until it is up.
#
# The step is token-gated: it skips cleanly, with no failed run, unless a
# CRATES_IO_TOKEN secret is available (repo- or org-level). Once it is, every
# tagged version publishes.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a crates.io token
        id: token
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: echo "present=${CRATES_IO_TOKEN:+true}" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
